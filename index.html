  <link rel="preload" as="font" type="font/woff2" crossorigin

  <!-- V217: revela os ícones SÓ quando a webfont Tabler está de fato disponível.
       document.fonts.ready resolvia cedo demais (antes do CSS do Tabler baixar) e o □ vazava.
       Aqui forçamos o download da fonte específica e confirmamos com .check(), com retry + failsafe. -->
  <script>
    (function () {
      var html = document.documentElement;
      var FONT = '1em "tabler-icons"';
      var revelado = false;
      function revelar() { if (!revelado) { revelado = true; html.classList.add('fonts-ready'); } }
      function pronto() {
        try { return document.fonts && document.fonts.check && document.fonts.check(FONT); }
        catch (e) { return false; }   // família ainda não registrada
      }
      function poll(n) {
        if (revelado) return;
        if (pronto()) { revelar(); return; }
        if (n <= 0) { revelar(); return; }   // failsafe por contagem
        setTimeout(function () { poll(n - 1); }, 80);
      }
      // dispara o download da fonte uma vez e começa o polling
      try { if (document.fonts && document.fonts.load) document.fonts.load(FONT).catch(function () {}); } catch (e) {}
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (pronto()) revelar(); });
      poll(50);                    // ~4s de polling (80ms × 50)
      setTimeout(revelar, 4500);   // failsafe absoluto de tempo
    })();
  </script>
